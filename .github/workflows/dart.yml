
name: Flutter CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Repository-den kod almak
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Flutter SDK gurmak
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Flutter wersiýasyny görkezmek
      - name: Flutter Version
        run: flutter --version

      # 4. Paketleri gurmak
      - name: Install Dependencies
        run: flutter pub get

      # 5. Kod formatyny barlamak
      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      # 6. Kod analizini geçirmek
      - name: Analyze Project
        run: flutter analyze

      # 7. Testleri işletmek
      - name: Run Tests
        run: flutter test

      # 8. Android APK gurmak
      - name: Build Android APK
        run: flutter build apk --release
